[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexquant"
version = "2.1.0"
description = "Advanced Quantitative Trading System with Machine Learning"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "prometheus_client>=0.17.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mock>=5.1",
    "python-dotenv>=0.19.0",
    "schedule>=1.1.0",
    "python-binance>=1.0.16",
    "alpaca-trade-api>=3.0.0",
    "yfinance>=0.2.38",
    "matplotlib>=3.7.0",
    "optuna>=3.5.0",
    "hmmlearn>=0.3.0",
    "vaderSentiment>=3.3.2",
    "feedparser>=6.0.0",
    "sentence-transformers>=2.2.0"
]

# superbot/ et ses sous-modules n'ont pas d'__init__.py (namespace packages).
# namespaces=true garantit qu'ils sont inclus dans `pip install -e .` et le build.
[tool.setuptools.packages.find]
include = ["superbot*", "resources*"]
namespaces = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I"]
ignore = ["E501"]
