[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers
markers =
    unit: Tests unitaires rapides
    chaos: Tests d'ingénierie du chaos et de résilience
    slow: Tests prenant plus de 5 secondes à exécuter
env =
    BROKER_TYPE=paper
